<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  {% if site.plugins contains "jekyll-seo-tag" %}
    {% seo %}
  {% endif %}

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css?family=Alegreya+Sans|Cinzel|Great+Vibes|Lora|Pacifico&display=swap" rel="stylesheet">

  <!-- Bootstrap & CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <!-- CSS files (use relative_url so it works with/without baseurl) -->
  <link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
  {% if page.css %}
    {% for css in page.css %}
      <link rel="stylesheet" href="{{ css | relative_url }}">
    {% endfor %}
  {% endif %}
</head>
<body>

  {% include header.html %}

  <main class="container my-4">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

  {% if page.scripts %}
    {% for js in page.scripts %}
      <script src="{{ js | relative_url }}" defer></script>
    {% endfor %}
  {% endif %}

  <script>
(function () {
  const header = document.querySelector('.header');
  if (!header) return;
  const root = document.documentElement;
  let ticking = false;

  function syncPad() { root.style.setProperty('--header-current-height', header.offsetHeight + 'px'); }
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      header.classList.toggle('header--scrolled', window.scrollY > 12);
      syncPad(); ticking = false;
    });
  }
  document.addEventListener('DOMContentLoaded', () => { onScroll(); syncPad(); });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', syncPad);
})();
</script>


<script>
(() => {
  const VIEW_EL = document.getElementById('site-view-count');
  const WORKSPACE = 'acmloria-github';
  const NAME = 'acmloria-github';
  const BASE = `https://api.counterapi.dev/v2/${WORKSPACE}/${NAME}`;
  const SEEN = 'viewed_site_session';

  const show = (n) => { if (VIEW_EL) VIEW_EL.textContent = Number.isFinite(n) ? String(n) : '0'; };

  // 1) Read current up_count (from /stats → { data: { up_count } })
  async function readUpCount() {
    const res = await fetch(`${BASE}/stats`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`stats ${res.status}`);
    const j = await res.json();
    return Number.isFinite(j?.data?.up_count) ? j.data.up_count : NaN;
  }

  // 2) Increment using /up (GET)
  async function increment() {
    const res = await fetch(`${BASE}/up`, { method: 'GET', keepalive: true });
    if (!res.ok) throw new Error(`up ${res.status}`);
    // Many providers return { count }; keep a fallback for { data: { up_count } }
    const j = await res.json();
    return Number.isFinite(j?.data?.up_count) ? j.data.up_count
         : Number.isFinite(j?.count)          ? j.count
         : NaN;
  }

  (async () => {
    // Show current up_count
    const current = await readUpCount().catch(() => NaN);
    if (Number.isFinite(current)) show(current);

    // Count this session once
    if (!sessionStorage.getItem(SEEN)) {
      sessionStorage.setItem(SEEN, '1');

      // Optimistic UI: display +1 immediately if we had a number
      if (Number.isFinite(current)) show(current + 1);

      // Increment on the server
      const after = await increment().catch(() => NaN);

      // Due to buffering, re-read /stats if we didn't get a clean number back
      if (Number.isFinite(after)) {
        // If increment returned {count}, it may equal up_count; re-read to be sure
        setTimeout(async () => {
          const reread = await readUpCount().catch(() => NaN);
          if (Number.isFinite(reread)) show(reread);
        }, 800);
      } else {
        setTimeout(async () => {
          const reread = await readUpCount().catch(() => NaN);
          if (Number.isFinite(reread)) show(reread);
        }, 800);
      }
    }
  })();
})();
</script>


</body>
</html>
