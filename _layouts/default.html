<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  {% if site.plugins contains "jekyll-seo-tag" %}
    {% seo %}
  {% endif %}

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css?family=Alegreya+Sans|Cinzel|Great+Vibes|Lora|Pacifico&display=swap" rel="stylesheet">

  <!-- Bootstrap & CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <!-- CSS files (use relative_url so it works with/without baseurl) -->
  <link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
  {% if page.css %}
    {% for css in page.css %}
      <link rel="stylesheet" href="{{ css | relative_url }}">
    {% endfor %}
  {% endif %}
</head>
<body>

  {% include header.html %}

  <main class="container my-4">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

  {% if page.scripts %}
    {% for js in page.scripts %}
      <script src="{{ js | relative_url }}" defer></script>
    {% endfor %}
  {% endif %}

  <script>
(function () {
  const header = document.querySelector('.header');
  if (!header) return;
  const root = document.documentElement;
  let ticking = false;

  function syncPad() { root.style.setProperty('--header-current-height', header.offsetHeight + 'px'); }
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      header.classList.toggle('header--scrolled', window.scrollY > 12);
      syncPad(); ticking = false;
    });
  }
  document.addEventListener('DOMContentLoaded', () => { onScroll(); syncPad(); });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', syncPad);
})();
</script>


<script>
(async () => {
  const el = document.getElementById('site-view-count');
  if (!el) return;

  const WORKER_BASE = 'https://ac-counter.YOURSUBDOMAIN.workers.dev'; // ← your worker URL
  const SESSION_KEY = 'viewed_site_session';
  const COUNTER_NAME = 'acmloria-github'; // or leave empty to use default

  const upURL  = `${WORKER_BASE}/up${COUNTER_NAME ? `?name=${encodeURIComponent(COUNTER_NAME)}` : ''}`;
  const getURL = `${WORKER_BASE}/get${COUNTER_NAME ? `?name=${encodeURIComponent(COUNTER_NAME)}` : ''}`;

  function show(n){ el.textContent = typeof n === 'number' ? n : '0'; }

  try {
    if (!sessionStorage.getItem(SESSION_KEY)) {
      sessionStorage.setItem(SESSION_KEY, '1');
      await fetch(upURL, { method: 'POST' });
    }
    const r = await fetch(getURL);
    const d = await r.json();
    show(d.count);
  } catch (e) {
    console.warn('counter worker error:', e);
    el.textContent = '…';
  }
})();
</script>


</body>
</html>
