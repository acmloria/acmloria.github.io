  <script>
(function () {
  const header = document.querySelector('.header');
  if (!header) return;
  const root = document.documentElement;
  let ticking = false;

  function syncPad() { root.style.setProperty('--header-current-height', header.offsetHeight + 'px'); }
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      header.classList.toggle('header--scrolled', window.scrollY > 12);
      syncPad(); ticking = false;
    });
  }
  document.addEventListener('DOMContentLoaded', () => { onScroll(); syncPad(); });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', syncPad);
})();
</script>

<script>
(function () {
  const el = document.getElementById('site-view-count');
  if (!el) return;

  // Avoid double-counting while user stays on the site (per tab/session)
  const KEY = 'ac_site_viewed';
  if (!sessionStorage.getItem(KEY)) {
    sessionStorage.setItem(KEY, '1');
    // increment and get the total
    fetch('https://api.countapi.xyz/hit/acmloria.github.io/total')
      .then(r => r.json()).then(d => el.textContent = d.value)
      .catch(() => el.textContent = '…');
  } else {
    // just read the current total without incrementing (optional)
    fetch('https://api.countapi.xyz/get/acmloria.github.io/total')
      .then(r => r.json()).then(d => el.textContent = d.value)
      .catch(() => el.textContent = '…');
  }
})();
</script>
