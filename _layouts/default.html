<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  {% if site.plugins contains "jekyll-seo-tag" %}
    {% seo %}
  {% endif %}

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css?family=Alegreya+Sans|Cinzel|Great+Vibes|Lora|Pacifico&display=swap" rel="stylesheet">

  <!-- Bootstrap & CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <!-- CSS files (use relative_url so it works with/without baseurl) -->
  <link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
  {% if page.css %}
    {% for css in page.css %}
      <link rel="stylesheet" href="{{ css | relative_url }}">
    {% endfor %}
  {% endif %}
</head>
<body>

  {% include header.html %}

  <main class="container my-4">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

  {% if page.scripts %}
    {% for js in page.scripts %}
      <script src="{{ js | relative_url }}" defer></script>
    {% endfor %}
  {% endif %}

  <script>
(function () {
  const header = document.querySelector('.header');
  if (!header) return;
  const root = document.documentElement;
  let ticking = false;

  function syncPad() { root.style.setProperty('--header-current-height', header.offsetHeight + 'px'); }
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      header.classList.toggle('header--scrolled', window.scrollY > 12);
      syncPad(); ticking = false;
    });
  }
  document.addEventListener('DOMContentLoaded', () => { onScroll(); syncPad(); });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', syncPad);
})();
</script>


<script>
(async () => {
  const el = document.getElementById('site-view-count');
  if (!el) return;

  const WORKSPACE = 'acmloria-github';
  const COUNTER   = 'acmloria-github';
  const BASE = `https://api.counterapi.dev/v2/${WORKSPACE}/${COUNTER}`;
  const SESSION_KEY = 'viewed_site_session';

  function show(n){ el.textContent = Number.isFinite(n) ? n : '0'; }

  // 1️⃣ Always read the current count first
  try {
    const res = await fetch(BASE, { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      const count = data?.data?.up_count ?? 0;
      show(count);
    } else {
      el.textContent = '…';
      console.warn('counter get failed', res.status);
    }
  } catch (e) {
    console.warn('counter get error:', e);
    el.textContent = '…';
  }

  // 2️⃣ Then, increment asynchronously if user hasn’t been counted yet
  setTimeout(async () => {
    if (sessionStorage.getItem(SESSION_KEY)) return; // already counted
    sessionStorage.setItem(SESSION_KEY, '1');        // mark as counted

    try {
      const r = await fetch(BASE + '/up', { method: 'POST' });
      if (r.ok) {
        const j = await r.json();
        const newCount = j?.count ?? j?.data?.up_count;
        if (Number.isFinite(newCount)) show(newCount);
      } else {
        console.warn('counter up failed', r.status);
      }
    } catch (e) {
      console.warn('counter up error:', e);
    }
  }, 1000); // delay 1 second (non-blocking)
})();
</script>

</body>
</html>
